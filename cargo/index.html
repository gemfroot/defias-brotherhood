<picture><source type="image/webp" srcset="p097.webp"><img src="p097.jpg" width="1200" height="2259" alt="“Bring the Crown&#x27;s chests to Master Sneekis. He weighs every coin.” “Ahh. Crown gold, fresh from the mint.”" loading="lazy" decoding="async"></picture>

<picture><source type="image/webp" srcset="p105.webp"><img src="p105.jpg" width="1200" height="2334" alt="“Easy, Edwin, easy. It&#x27;s not what it looks like.” “Ren. They&#x27;re Defias. All of them.” “Then they hate the Crown too, Tam.”" loading="lazy" decoding="async"></picture>
<picture><source type="image/webp" srcset="p106.webp"><img src="p106.jpg" width="1200" height="1530" alt="“That doesn&#x27;t make them our friends.”" loading="lazy" decoding="async"></picture>
